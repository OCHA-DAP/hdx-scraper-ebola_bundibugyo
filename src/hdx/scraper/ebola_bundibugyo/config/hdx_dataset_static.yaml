methodology: Direct Observational Data/Anecdotal Data
dataset_source: Centre des Opérations d'Urgences de Santé Publique (COUSP-RDC)
package_creator: HDX Data Systems Team
private: False
notes: |
  Ce jeu de données présente le nombre de cas et de décès liés à Ebola en République
  démocratique du Congo, désagrégés au niveau national et au niveau administratif 3.
  Les données incluent les cas suspects, probables et confirmés, ainsi que les décès
  suspects, probables et confirmés, rapportés dans les zones affectées.

  La colonne `location_level` distingue les totaux nationaux (0) des totaux par zone
  de santé (3) : ces derniers ne doivent pas être additionnés à un total national, car
  les totaux nationaux publiés par la source ne correspondent pas toujours à la somme
  des zones de santé (notamment pour les décès confirmés).

  Le jeu de données est fourni sous une ressource CSV contenant la base de données
  consolidée au format long.
