# ADM3 "Lubunga" is CD510102 in Tshopo, the outbreak location, and CD910703 in
# Kasai-Central. AdminLevel's name-based lookup incorrectly resolves to CD910703.
admin_name_mappings:
  "COD|Lubunga": "CD510102"
  "COD|Lubunga (Tshopo)": "CD510102"
